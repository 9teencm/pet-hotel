<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會員註冊 - PetHotel Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
      .animate-fade-in {
        animation: fadeIn 0.4s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-orange-50 font-sans text-gray-800">
    <div id="app"></div>

    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const registerData = ref({
            email: '',
            password: '',
            name: '',
          });
          const isLoading = ref(false);
          const errorMessage = ref('');
          const successMessage = ref('');

          const handleRegister = async () => {
            isLoading.value = true;
            errorMessage.value = '';
            successMessage.value = '';
            
            try {
              const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registerData.value)
              });

              const data = await response.json();

              if (response.ok) {
                successMessage.value = '註冊成功！正在為您登入並跳轉至首頁...';
                // 儲存註冊成功後回傳的 Token
                localStorage.setItem('access_token', data.access_token);
                setTimeout(() => {
                  window.location.href = './index.html';
                }, 1500);
              } else {
                errorMessage.value = data.error || '註冊失敗，請檢查輸入欄位';
              }
            } catch (err) {
              errorMessage.value = '連線伺服器失敗，請稍後再試';
            } finally {
              isLoading.value = false;
            }
          };

          return { registerData, handleRegister, isLoading, errorMessage, successMessage };
        },
        template: `
          <div class="min-h-screen flex flex-col">
            <header class="bg-white shadow-sm sticky top-0 z-10">
              <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <a href="./index.html" class="text-2xl font-extrabold text-orange-600 hover:text-orange-700 transition">🐾 PetHotel Pro</a>
              </div>
            </header>

            <main class="flex-grow flex items-center justify-center px-4 py-12">
              <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 md:p-10 animate-fade-in">
                <div class="text-center mb-8">
                  <h2 class="text-3xl font-extrabold text-gray-900">建立新帳號</h2>
                  <p class="text-gray-500 mt-2">註冊以開啟您的寵物安親預約服務</p>
                </div>

                <div v-if="errorMessage" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm">
                  {{ errorMessage }}
                </div>

                <div v-if="successMessage" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm">
                  {{ successMessage }}
                </div>

                <form @submit.prevent="handleRegister" class="space-y-6">
                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">您的姓名 (Name)</label>
                    <input type="text" v-model="registerData.name" required
                      class="w-full border-gray-300 rounded-lg shadow-sm focus:border-orange-500 focus:ring-orange-500 p-3 border transition"
                      placeholder="例如：王小明">
                  </div>

                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">電子郵件 (Email)</label>
                    <input type="email" v-model="registerData.email" required
                      class="w-full border-gray-300 rounded-lg shadow-sm focus:border-orange-500 focus:ring-orange-500 p-3 border transition"
                      placeholder="example@mail.com">
                  </div>

                  <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">密碼 (Password)</label>
                    <input type="password" v-model="registerData.password" required minlength="6"
                      class="w-full border-gray-300 rounded-lg shadow-sm focus:border-orange-500 focus:ring-orange-500 p-3 border transition"
                      placeholder="至少 6 位字元">
                  </div>

                  <button type="submit" :disabled="isLoading"
                    class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600 disabled:opacity-50 transition shadow-md hover:shadow-lg flex items-center justify-center">
                    <span v-if="isLoading" class="animate-spin mr-2">⏳</span>
                    {{ isLoading ? '註冊中...' : '立即註冊' }}
                  </button>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                  <p class="text-sm text-gray-600">
                    已經有帳號了？ 
                    <a href="./login.html" class="text-orange-600 font-bold hover:text-orange-700 transition">點我登入</a>
                  </p>
                </div>
              </div>
            </main>

            <footer class="py-6 text-center text-gray-400 text-xs">
              &copy; 2026 PetHotel Pro. All rights reserved.
            </footer>
          </div>
        `,
      }).mount('#app');
    </script>
  </body>
</html>
